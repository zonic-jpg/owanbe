# OwanbeX — Vite SPA. Publish "dist". Mock-by-default until Supabase is wired.
[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # VITE_SUPABASE_URL — set via Netlify UI/API env (do not hardcode)
  # VITE_SUPABASE_ANON_KEY — set via Netlify UI/API env (do not hardcode)
  # Never call Google OAuth without provider secret configured in Supabase.
  VITE_GOOGLE_AUTH = "false"

# SPA deep-link fallback for react-router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
