name: E2E Journey Tests
on: [push, pull_request]
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Tier 1 runs always. Tier 2 (data flows) runs only when the Supabase
      # test backend secret is configured on the repo.
      - run: npm run test:e2e
        env:
          E2E_BACKEND: ${{ secrets.E2E_BACKEND }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: playwright-report/, retention-days: 14 }
