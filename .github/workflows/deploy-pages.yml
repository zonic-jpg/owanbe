name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /owanbe/
          VITE_SUPABASE_URL: https://nuleyrowkiuxrnlrkrkd.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im51bGV5cm93a2l1eHJubHJrcmtkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMDc5OTIsImV4cCI6MjEwMzc4Mzk5Mn0.xKdRH0HbGc6wztT_TL5Q4ZkUrcU4tRCl2cVwakaFYhQ
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
